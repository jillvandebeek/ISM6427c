<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Weather app powered by the free Open-Meteo API. Default location: Boca Raton, Florida.">
  <meta name="color-scheme" content="light dark">
  <title>Sky Check | Weather</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('theme') || 'system';
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">⛅</span>
      <span class="brand-name">Sky Check</span>
    </div>
    <div class="theme-switch" role="radiogroup" aria-label="Theme">
      <button type="button" role="radio" data-theme-choice="light" title="Light theme">☀️<span>Light</span></button>
      <button type="button" role="radio" data-theme-choice="dark" title="Dark theme">🌙<span>Dark</span></button>
      <button type="button" role="radio" data-theme-choice="system" title="Follow system setting">💻<span>System</span></button>
    </div>
  </header>

  <main class="container">
    <section class="greeting" aria-live="polite">
      <h1 id="greeting-title">Hello, Jill Vandebeek!</h1>
      <p id="greeting-sub">Welcome to your personal weather dashboard.</p>
    </section>

    <form id="search-form" class="search" role="search" autocomplete="off">
      <label for="search-input" class="visually-hidden">Search for a city</label>
      <input id="search-input" type="search" placeholder="Search a city (e.g. Miami, Brussels)" aria-autocomplete="list" aria-controls="search-results">
      <button type="submit" class="btn">Search</button>
      <button type="button" id="home-btn" class="btn btn-ghost" title="Back to Boca Raton">🏠 Boca</button>
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </form>

    <div class="unit-toggle" role="group" aria-label="Temperature unit">
      <button type="button" data-unit="fahrenheit">°F</button>
      <button type="button" data-unit="celsius">°C</button>
    </div>

    <p id="status" class="status" role="status"></p>

    <section id="current" class="card current" hidden>
      <div class="current-main">
        <div>
          <h2 id="location-name">Boca Raton</h2>
          <p id="location-meta" class="muted"></p>
          <p id="current-desc" class="current-desc"></p>
        </div>
        <div class="current-temp">
          <span id="current-icon" class="big-icon" aria-hidden="true"></span>
          <span id="current-temp" class="temp"></span>
        </div>
      </div>
      <dl class="stats">
        <div><dt>Feels like</dt><dd id="stat-feels"></dd></div>
        <div><dt>Humidity</dt><dd id="stat-humidity"></dd></div>
        <div><dt>Wind</dt><dd id="stat-wind"></dd></div>
        <div><dt>Precipitation</dt><dd id="stat-precip"></dd></div>
        <div><dt>UV index</dt><dd id="stat-uv"></dd></div>
        <div><dt>Sunrise / Sunset</dt><dd id="stat-sun"></dd></div>
      </dl>
    </section>

    <section id="hourly-section" class="card" hidden>
      <h3>Next 24 hours</h3>
      <div id="hourly" class="hourly"></div>
    </section>

    <section id="daily-section" class="card" hidden>
      <h3>7 day forecast</h3>
      <ul id="daily" class="daily"></ul>
    </section>
  </main>

  <footer class="footer">
    Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0)
  </footer>

  <script src="app.js"></script>
</body>
</html>
