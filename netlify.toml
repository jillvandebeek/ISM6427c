# Static site: no build step needed. Netlify serves the repository root.
[build]
  publish = "."
  command = ""

# Same-origin proxy for the NASA APOD API (moved to the NASA Science WordPress API
# in Sept 2026), so the browser never depends on that host's CORS headers.
[[redirects]]
  from = "/api/apod/*"
  to = "https://science.nasa.gov/wp-json/wp/v2/apod-basic/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
