# Ruimtewacht: a small watchdog agent for the NASA quiz.
# Every morning it checks the NASA APIs the quiz depends on. When something breaks it opens
# (or updates) an issue labeled "ruimtewacht"; when everything works again it closes that issue.
name: Ruimtewacht

on:
  schedule:
    - cron: '17 6 * * *'   # daily at 06:17 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check NASA endpoints
        id: check
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}   # optional, falls back to DEMO_KEY
        run: node .github/scripts/ruimtewacht.mjs

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          gh label create ruimtewacht --color 1d3b8b --description "Melding van de Ruimtewacht" 2>/dev/null || true
          open_issue=$(gh issue list --label ruimtewacht --state open --json number --jq '.[0].number')
          if [ "$FAILED" = "true" ]; then
            if [ -n "$open_issue" ]; then
              gh issue comment "$open_issue" --body-file ruimtewacht-report.md
            else
              gh issue create --title "🛰️ Ruimtewacht: een NASA-bron van de quiz werkt niet" \
                --label ruimtewacht --body-file ruimtewacht-report.md
            fi
          elif [ -n "$open_issue" ]; then
            gh issue close "$open_issue" --comment "Alles werkt weer ✅ $(cat ruimtewacht-report.md)"
          fi
